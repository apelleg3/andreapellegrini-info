<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music & Hip-Hop Evolution Since 1986 | 40th Birthday Timeline</title>
    <style>
        :root {
            --jazz-teal: #00F0C2;
            --jazz-purple: #B624FF;
            --retro-orange: #FF5500;
            --bg-dark: #0B0B0E;
            --card-bg: #16161C;
            --text-light: #FFFFFF;
            --text-muted: #D1D1D6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(255, 85, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 194, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            padding-bottom: 5rem;
        }

        /* Hero Header styled like the abstract brush strokes of 90s culture */
        header {
            text-align: center;
            padding: 5rem 1.5rem 3rem;
            position: relative;
        }

        header h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--retro-orange), var(--jazz-purple), var(--jazz-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Accessible Filters */
        .controls {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .search-bar {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: 2px solid var(--jazz-purple);
            background: #000000;
            color: white;
            font-size: 1rem;
            width: 100%;
            max-width: 350px;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--retro-orange);
            box-shadow: 0 0 0 3px rgba(255, 85, 0, 0.3);
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.15);
            background: var(--card-bg);
            color: white;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--text-light);
            color: var(--bg-dark);
            border-color: var(--text-light);
        }

        /* Timeline Construct */
        .timeline-container {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .timeline-container::after {
            content: '';
            position: absolute;
            width: 4px;
            background: linear-gradient(to bottom, var(--retro-orange), var(--jazz-purple), var(--jazz-teal));
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
        }

        .timeline-item {
            padding: 20px 0;
            position: relative;
            width: 50%;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease-out;
        }

        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .timeline-item.left { left: 0; padding-right: 40px; }
        .timeline-item.right { left: 50%; padding-left: 40px; }

        /* Timeline Nodes */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            right: -8px;
            background-color: var(--bg-dark);
            border: 4px solid var(--retro-orange);
            top: 35px;
            border-radius: 50%;
            z-index: 2;
        }
        .timeline-item.right::after { left: -8px; border-color: var(--jazz-teal); }

        .content-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .content-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .year-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-badge {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-light);
        }

        .tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .tag.hiphop { background-color: var(--retro-orange); color: #000000; }
        .tag.music { background-color: var(--jazz-purple); color: #FFFFFF; }
        .tag.milestone { background-color: var(--jazz-teal); color: #000000; }

        .content-card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .content-card p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        .wiki-link {
            display: inline-flex;
            align-items: center;
            color: var(--jazz-teal);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            border-bottom: 2px solid transparent;
            transition: border 0.2s ease;
        }

        .wiki-link:hover {
            border-color: var(--jazz-teal);
        }

        /* Responsive Layout Overrides */
        @media screen and (max-width: 768px) {
            .timeline-container::after { left: 20px; }
            .timeline-item { width: 100%; padding-left: 45px; padding-right: 0; text-align: left !important; }
            .timeline-item.right { left: 0; }
            .timeline-item::after { left: 12px !important; right: auto !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>40 Years of Beats &amp; Rhythm</h1>
        <p>A curated history of game-changing US hip-hop movements and cultural shifts from your birth year (1986) up to 2026.</p>
    </header>

    <div class="controls">
        <input type="text" id="search" class="search-bar" placeholder="Filter by artist, year, or track...">
        <button class="filter-btn active" onclick="filterTimeline('all')">All Eras</button>
        <button class="filter-btn" onclick="filterTimeline('hiphop')">Hip-Hop</button>
        <button class="filter-btn" onclick="filterTimeline('music')">Music Core</button>
        <button class="filter-btn" onclick="filterTimeline('milestone')">Personal</button>
    </div>

    <main class="timeline-container" id="timeline">
        </main>

    <script>
        const timelineData = [
            {
                year: '1986',
                type: 'hiphop',
                title: 'Run-D.M.C. Crosses Over With "Walk This Way"',
                desc: 'Collaborating with Aerosmith, Run-D.M.C. breaks down racial and sonic barriers, exploding hip-hop into mainstream pop charts and global radio systems.',
                wiki: 'https://en.wikipedia.org/wiki/Walk_This_Way#Run-D.M.C._version'
            },
            {
                year: '1988',
                type: 'hiphop',
                title: 'N.W.A Outlines West Coast Gangsta Rap',
                desc: 'Straight Outta Compton lands, shifting American musical focus directly from New York to California with unmatched socio-political commentary.',
                wiki: 'https://en.wikipedia.org/wiki/Straight_Outta_Compton'
            },
            {
                year: '1989',
                type: 'music',
                title: 'First Rap Grammy Award Ever Presented',
                desc: 'DJ Jazzy Jeff & The Fresh Prince grab the inaugural Best Rap Performance award for "Parents Just Don\'t Understand", cementing genre legitimacy.',
                wiki: 'https://en.wikipedia.org/wiki/Grammy_Award_for_Best_Rap_Performance'
            },
            {
                year: '1992',
                type: 'hiphop',
                title: 'Dr. Dre Drops "The Chronic" & Defines G-Funk',
                desc: 'Dr. Dre unleashes his masterwork, launching Snoop Dogg and structuring a funky, synthesized lifestyle soundscape that defined 90s hip-hop production.',
                wiki: 'https://en.wikipedia.org/wiki/The_Chronic'
            },
            {
                year: '1994',
                type: 'music',
                title: 'The Golden Age Masterpiece: Illmatic',
                desc: 'Nas releases his legendary debut studio album, defining lyricism and the East Coast hip-hop sound profile for a generation.',
                wiki: 'https://en.wikipedia.org/wiki/Illmatic'
            },
            {
                year: '1996',
                type: 'hiphop',
                title: '2Pac & Jay-Z Anchor a Legendary Year',
                desc: '2Pac releases "All Eyez on Me" while Jay-Z steps forward with "Reasonable Doubt," highlighting a golden pinnacle of competitive American rhyme architecture.',
                wiki: 'https://en.wikipedia.org/wiki/All_Eyez_on_Me'
            },
            {
                year: '1998',
                type: 'music',
                title: 'Lauryn Hill Achieves Historic Solo Sweep',
                desc: 'The Miseducation of Lauryn Hill mixes neo-soul and sharp rap verses, transforming R&B and earning five Grammys in a single historic night.',
                wiki: 'https://en.wikipedia.org/wiki/The_Miseducation_of_Lauryn_Hill'
            },
            {
                year: '2003',
                type: 'hiphop',
                title: 'The OutKast Double-Album Phenomenon',
                desc: 'Speakerboxxx/The Love Below climbs to cross-genre ubiquity, introducing "Hey Ya!" and showing the artistic vastness of Southern hip-hop.',
                wiki: 'https://en.wikipedia.org/wiki/Speakerboxxx/The_Love_Below'
            },
            {
                year: '2004',
                type: 'music',
                title: 'Kanye West Reinvents with "The College Dropout"',
                desc: 'Stepping out from behind the production board, Kanye introduces sped-up soul samples and conscious lyricism back to commercial success.',
                wiki: 'https://en.wikipedia.org/wiki/The_College_Dropout'
            },
            {
                year: '2015',
                type: 'hiphop',
                title: 'Kendrick Lamar Redefines Modern Protest Art',
                desc: 'To Pimp a Butterfly blends jazz, funk, and spoken word poetry. The track "Alright" becomes a generational civil rights rallying cry.',
                wiki: 'https://en.wikipedia.org/wiki/To_Pimp_a_Butterfly'
            },
            {
                year: '2018',
                type: 'music',
                title: 'First Hip-Hop Pulitzer Prize Win',
                desc: 'Kendrick Lamar wins the Pulitzer Prize for Music for his album DAMN., marking the first time a non-classical, non-jazz artist wins the honor.',
                wiki: 'https://en.wikipedia.org/wiki/Damn_(Kendrick_Lamar_album)'
            },
            {
                year: '2024',
                type: 'hiphop',
                title: 'The Great Lyric Battle Era',
                desc: 'The ultimate high-stakes showdown between Kendrick Lamar and Drake grips global pop culture, generating chart-topping multi-platinum diss tracks.',
                wiki: 'https://en.wikipedia.org/wiki/Drake%E2%80%93Kendrick_Lamar_feud'
            },
            {
                year: '2026',
                type: 'milestone',
                title: 'Cheers to 40 Years of Modern Greatness!',
                desc: 'Four full decades of iconic rhythm, world-changing sound evolution, and timeless personal history. The ultimate chapter begins now!',
                wiki: 'https://en.wikipedia.org/wiki/Hip-hop_music'
            }
        ];

        const timelineContainer = document.getElementById('timeline');

        function renderTimeline(data) {
            timelineContainer.innerHTML = '';
            data.forEach((item, index) => {
                const side = index % 2 === 0 ? 'left' : 'right';
                const itemEl = document.createElement('article');
                itemEl.className = `timeline-item ${side}`;
                
                itemEl.innerHTML = `
                    <div class="content-card">
                        <div class="year-header">
                            <span class="year-badge">${item.year}</span>
                            <span class="tag ${item.type}">${item.type === 'hiphop' ? 'Hip-Hop' : item.type === 'music' ? 'Music' : 'Milestone'}</span>
                        </div>
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                        <a href="${item.wiki}" target="_blank" rel="noopener noreferrer" class="wiki-link" aria-label="Read more about ${item.title} on Wikipedia">
                            Explore History &rarr;
                        </a>
                    </div>
                `;
                timelineContainer.appendChild(itemEl);
            });

            // Smooth fade-in observer logic
            setTimeout(() => {
                const items = document.querySelectorAll('.timeline-item');
                items.forEach(item => item.classList.add('visible'));
            }, 50);
        }

        // Live text search matching filter
        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = timelineData.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.year.includes(query) || 
                item.desc.toLowerCase().includes(query)
            );
            renderTimeline(filtered);
        });

        // Filter button switching mechanism
        function filterTimeline(type) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (type === 'all') {
                renderTimeline(timelineData);
            } else {
                const filtered = timelineData.filter(item => item.type === type);
                renderTimeline(filtered);
            }
        }

        // Run render on window start load
        renderTimeline(timelineData);
    </script>
</body>
</html>
