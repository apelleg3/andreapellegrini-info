<head>

    <!--
      ============================================================
        HOW TO PERSONALIZE THIS TIMELINE
      ============================================================
      1. EVENTS: scroll down to the `events` array in the <script>.
         Each card is one object. Copy one to add a new event.

      2. CATEGORIES / COLORS: see the `categories` object. Add or
         recolor freely — the accent flows automatically into the
         dot, tag, and link icons.

      3. LINKS: every event has a `links` object with four optional
         slots: wikipedia, maps, notion, photos.
           - Put a real URL to show that icon.
           - Leave it as ''  (empty)  to hide it.
           - Put the word 'ADD' to show a dashed "add link" chip
             (handy reminder for travel cards you'll fill in later).
         So for a place he's visited / wants to visit, paste your
         Notion page, Google Maps pin, and Google Photos album URLs
         straight into notion / maps / photos.
      ============================================================
    -->

    <style>
        :root {
            --bg-dark: #0B0B0E;
            --card-bg: #16161C;
            --text-light: #FFFFFF;
            --text-muted: #D6D6DC;            /* ~11:1 on card bg */
            --hairline: rgba(255,255,255,0.10);
            --hairline-strong: rgba(255,255,255,0.30);
        }

        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            background-image:
                linear-gradient(rgba(255, 85, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 194, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            padding-bottom: 5rem;
        }

        .visually-hidden {
            position: absolute; width: 1px; height: 1px; padding: 0;
            margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
            white-space: nowrap; border: 0;
        }

        /* Visible keyboard focus everywhere */
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 3px solid #FFFFFF;
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* Skip link */
        .skip-link {
            position: absolute; left: 1rem; top: -3rem;
            background: #fff; color: #000; padding: 0.6rem 1rem;
            border-radius: 8px; font-weight: 700; z-index: 10;
            transition: top 0.2s ease;
        }
        .skip-link:focus { top: 1rem; }

        header {
            text-align: center;
            padding: 4.5rem 1.5rem 2rem;
            position: relative;
        }

        header h1 {
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.05;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FF5500, #FF4D9D, #B624FF, #4DD0FF, #00F0C2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            max-width: 720px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Color/category legend (text labels, never color alone) */
        .legend {
            list-style: none;
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 0.5rem 1.1rem;
            max-width: 760px;
            margin: 1.75rem auto 0;
            padding: 0 1rem;
        }
        .legend li {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-size: 0.82rem; color: var(--text-muted); font-weight: 600;
        }
        .legend .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent); flex: none;
            box-shadow: 0 0 8px var(--accent);
        }

        /* Controls */
        .controls {
            display: flex; justify-content: center; align-items: center;
            gap: 0.6rem; margin: 2.5rem auto 3.5rem;
            flex-wrap: wrap; padding: 0 1rem; max-width: 940px;
        }
        .search-wrap { flex: 1 1 280px; max-width: 360px; }
        .search-bar {
            padding: 0.75rem 1.1rem; border-radius: 10px;
            border: 2px solid #B624FF; background: #000;
            color: #fff; font-size: 1rem; width: 100%; outline: none;
        }
        .search-bar::placeholder { color: #9a9aa3; }
        .search-bar:focus { border-color: #FF5500; box-shadow: 0 0 0 3px rgba(255,85,0,0.3); }

        .filter-group { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
        .filter-btn {
            padding: 0.6rem 1rem; border-radius: 999px;
            border: 2px solid var(--hairline); background: var(--card-bg);
            color: #fff; cursor: pointer; font-weight: 700;
            text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.5px;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
            display: inline-flex; align-items: center; gap: 0.45rem;
        }
        .filter-btn .swatch {
            width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
        }
        .filter-btn:hover { border-color: var(--hairline-strong); }
        .filter-btn[aria-pressed="true"] {
            background: #fff; color: var(--bg-dark); border-color: #fff;
        }
        .filter-btn[aria-pressed="true"] .swatch { box-shadow: 0 0 0 2px rgba(0,0,0,0.15); }

        /* Timeline */
        .timeline-container {
            position: relative; max-width: 920px; margin: 0 auto;
            padding: 0 1.5rem; list-style: none;
        }
        .timeline-container::after {
            content: ''; position: absolute; width: 4px;
            background: linear-gradient(to bottom, #FF5500, #FF4D9D, #B624FF, #4DD0FF, #00F0C2);
            top: 0; bottom: 0; left: 50%; margin-left: -2px; border-radius: 4px;
        }
        .timeline-container.is-empty::after { display: none; }

        .timeline-item {
            padding: 20px 0; position: relative; width: 50%;
            opacity: 0; transform: translateY(28px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .timeline-item.visible { opacity: 1; transform: translateY(0); }
        .timeline-item.left  { left: 0;   padding-right: 42px; text-align: right; }
        .timeline-item.right { left: 50%; padding-left: 42px;  text-align: left; }
        .timeline-item.left .year-header,
        .timeline-item.left .link-row { justify-content: flex-end; }

        /* Category-colored node */
        .timeline-item::after {
            content: ''; position: absolute; width: 17px; height: 17px;
            background-color: var(--bg-dark); border: 4px solid var(--accent);
            top: 35px; border-radius: 50%; z-index: 2;
            box-shadow: 0 0 10px var(--accent);
        }
        .timeline-item.left::after  { right: -8.5px; }
        .timeline-item.right::after { left: -8.5px; }

        .content-card {
            background: var(--card-bg); padding: 1.6rem 1.7rem; border-radius: 14px;
            border: 1px solid var(--hairline); position: relative; text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: border-color 0.2s ease, transform 0.2s ease;

        .content-card:hover { border-color: var(--accent); transform: translateY(-2px); }

        .year-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem; flex-wrap: wrap; }
        .year-badge { font-size: 1.55rem; font-weight: 900; line-height: 1; }
        .tag {
            font-size: 0.7rem; text-transform: uppercase; padding: 0.28rem 0.65rem;
            border-radius: 5px; font-weight: 800; letter-spacing: 0.5px;
            background: var(--accent); color: #000;   /* black text -> AA contrast on all accents */
        }

        .content-card h3 { font-size: 1.18rem; margin-bottom: 0.6rem; line-height: 1.3; }
        .content-card p.desc { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; margin-bottom: 1.1rem; }

        /* Link icon row */
        .link-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .link-chip {
            width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 11px; border: 1px solid var(--hairline);
            background: rgba(255,255,255,0.02); color: var(--text-muted);
            cursor: pointer; transition: all 0.18s ease; text-decoration: none;
        }
        .link-chip svg { width: 21px; height: 21px; }
        .link-chip:hover { color: #000; background: var(--accent); border-color: var(--accent); }
        .link-chip.ghost { border-style: dashed; opacity: 0.7; }
        .link-chip.ghost:hover { opacity: 1; color: var(--accent); background: rgba(255,255,255,0.04); border-color: var(--accent); }

        .hint {
            margin-top: 0.85rem; font-size: 0.82rem; line-height: 1.5;
            color: var(--text-muted); background: rgba(255,255,255,0.04);
            border-left: 3px solid var(--accent); padding: 0.6rem 0.8rem; border-radius: 6px;
        }
        .hint code { background: rgba(255,255,255,0.08); padding: 0.05rem 0.3rem; border-radius: 4px; }

        .empty-state {
            text-align: center; color: var(--text-muted); padding: 3rem 1rem;
            font-size: 1.05rem; line-height: 1.6;
        }
        .empty-state strong { color: #fff; }

        /* Mobile: single column */
        @media screen and (max-width: 760px) {
            .timeline-container::after { left: 18px; }
            .timeline-item { width: 100%; padding-left: 46px; padding-right: 0; text-align: left; }
            .timeline-item.right { left: 0; }
            .timeline-item.left { left: 0; text-align: left; }
            .timeline-item.left .year-header, .timeline-item.left .link-row { justify-content: flex-start; }
            .timeline-item.left::after, .timeline-item.right::after { left: 10px; right: auto; }
        }

        /* Respect reduced-motion preferences */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
            .timeline-item { opacity: 1; transform: none; }
            .skip-link { transition: none; }
        }
    </style>
</head>

            { key: 'maps',      name: 'Google Maps' },
            { key: 'notion',    name: 'Notion notes' },
            { key: 'photos',    name: 'photo album' }
        ];

        const timeline = document.getElementById('timeline');
        const statusEl = document.getElementById('status');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ----------  Build legend + filter buttons from categories  ---------- */
        const legendEl = document.getElementById('legend');
        const filtersEl = document.getElementById('filters');

        Object.values(categories).forEach(c => {
            const li = document.createElement('li');
            li.style.setProperty('--accent', c.accent);
            li.innerHTML = `<span class="dot" aria-hidden="true"></span>${c.label}`;
            legendEl.appendChild(li);
        });

        const filterDefs = [{ id: 'all', label: 'All Eras', accent: '#FFFFFF' },
            ...Object.entries(categories).map(([id, c]) => ({ id, label: c.label, accent: c.accent }))];

        filterDefs.forEach((f, i) => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.filter = f.id;
            btn.style.setProperty('--accent', f.accent);
            btn.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
            const swatch = f.id === 'all' ? '' : '<span class="swatch" aria-hidden="true"></span>';
            btn.innerHTML = `${swatch}${f.label}`;
            filtersEl.appendChild(btn);
        });

        /* ----------  State + rendering  ---------- */
        let state = { filter: 'all', query: '' };

        function escapeAttr(s) { return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

        function buildLinks(ev, idx) {
            let chips = '';
            LINK_ORDER.forEach(({ key, name }) => {
                const val = ev.links ? ev.links[key] : '';
                if (!val) return;
                const icon = ICONS[key];
                if (val === 'ADD') {
                    chips += `<button type="button" class="link-chip ghost" data-hint="${idx}"
                        aria-label="Add a ${name} link for ${escapeAttr(ev.title)}" title="Add ${name}">${icon}</button>`;
                } else {
                    chips += `<a class="link-chip" href="${escapeAttr(val)}" target="_blank" rel="noopener noreferrer"
                        aria-label="Open ${name} for ${escapeAttr(ev.title)} (opens in a new tab)" title="${name}">${icon}</a>`;
                }
            });
            return chips;
        }

        function render(list) {
            timeline.innerHTML = '';
            timeline.classList.toggle('is-empty', list.length === 0);

            if (list.length === 0) {
                const li = document.createElement('li');
                li.className = 'empty-state';
                li.innerHTML = '<strong>No events match that.</strong><br>Try another era or clear the search.';
                timeline.appendChild(li);
                statusEl.textContent = `No events match. ${events.length} total.`;
                return;
            }

            list.forEach((ev, index) => {
                const cat = categories[ev.type] || { label: ev.type, accent: '#fff' };
                const side = index % 2 === 0 ? 'left' : 'right';
                const headingId = `event-${ev.year}-${index}`;

                const li = document.createElement('li');
                li.className = `timeline-item ${side}`;
                li.style.setProperty('--accent', cat.accent);
                li.innerHTML = `
                    <article class="content-card" aria-labelledby="${headingId}">
                        <div class="year-header">
                            <span class="year-badge">${ev.year}</span>
                            <span class="tag">${cat.label}</span>
                        </div>
                        <h3 id="${headingId}">${ev.title}</h3>
                        <p class="desc">${ev.desc}</p>
                        <div class="link-row">${buildLinks(ev, index)}</div>
                        <p class="hint" hidden>To wire this up, open the file, find the
                            <code>"${escapeAttr(ev.title)}"</code> card and paste your URL into its
                            <code>links</code> (Notion page, Google Maps pin, or Google Photos album).</p>
                    </article>`;
                timeline.appendChild(li);
            });

            // Reveal animation (skipped when reduced motion is on)
            requestAnimationFrame(() => {
                document.querySelectorAll('.timeline-item').forEach(item => item.classList.add('visible'));
            });

            const label = state.filter === 'all' ? '' : ` in ${categories[state.filter]?.label || state.filter}`;
            statusEl.textContent = `Showing ${list.length} of ${events.length} events${label}.`;
        }

        function applyFilters() {
            const q = state.query.trim().toLowerCase();
            const filtered = events.filter(ev => {
                const matchType = state.filter === 'all' || ev.type === state.filter;
                const matchText = !q ||
                    ev.title.toLowerCase().includes(q) ||
                    ev.desc.toLowerCase().includes(q) ||
                    String(ev.year).includes(q) ||
                    (categories[ev.type]?.label || '').toLowerCase().includes(q);
                return matchType && matchText;
            });
            render(filtered);
        }

        /* ----------  Events  ---------- */
        document.getElementById('search').addEventListener('input', e => {
            state.query = e.target.value;
            applyFilters();
        });

        filtersEl.addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            state.filter = btn.dataset.filter;
            filtersEl.querySelectorAll('.filter-btn').forEach(b =>
                b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
            applyFilters();
        });

        // Toggle the "how to add a link" hint on ghost chips
        timeline.addEventListener('click', e => {
            const ghost = e.target.closest('.ghost');
            if (!ghost) return;
            const hint = ghost.closest('.content-card').querySelector('.hint');
            const nowHidden = hint.hasAttribute('hidden');
            if (nowHidden) hint.removeAttribute('hidden'); else hint.setAttribute('hidden', '');
            ghost.setAttribute('aria-expanded', String(nowHidden));
        });

        applyFilters();
    </script>
</body>
</html>
