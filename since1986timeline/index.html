<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40 Years of Giant Highlights | Interactive Timeline</title>
    <style>
        :root {
            --jazz-teal: #00F0C2;
            --jazz-purple: #B624FF;
            --retro-orange: #FF5500;
            --bg-dark: #0A0A0D;
            --card-bg: #14141A;
            --text-light: #FFFFFF;
            --text-muted: #D1D1D6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 240, 194, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 85, 0, 0.03) 1px, transparent 1px);
            background-size: 25px 25px;
            padding-bottom: 5rem;
        }

        header {
            text-align: center;
            padding: 5rem 1.5rem 3rem;
        }

        header h1 {
            font-size: clamp(2.2rem, 5vw, 4.2rem);
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, var(--retro-orange), var(--jazz-purple), var(--jazz-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: clamp(1rem, 2vw, 1.25rem);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .search-bar {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 2px solid var(--jazz-purple);
            background: #000000;
            color: white;
            font-size: 1rem;
            width: 100%;
            max-width: 300px;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--retro-orange);
            box-shadow: 0 0 0 3px rgba(255, 85, 0, 0.3);
        }

        .filter-btn {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.15);
            background: var(--card-bg);
            color: white;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--text-light);
            color: var(--bg-dark);
            border-color: var(--text-light);
        }

        /* Timeline & Jazz Cup Backdrop Track */
        .timeline-container {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* The central line mimics the iconic jagged brush stroke from the cup design */
        .timeline-container::after {
            content: '';
            position: absolute;
            width: 6px;
            background: linear-gradient(135deg, 
                var(--jazz-teal) 0%, 
                var(--jazz-purple) 25%, 
                var(--jazz-teal) 50%, 
                var(--retro-orange) 75%, 
                var(--jazz-purple) 100%);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -3px;
            border-radius: 10px;
        }

        .timeline-item {
            padding: 20px 0;
            position: relative;
            width: 50%;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease-out;
        }

        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .timeline-item.left { left: 0; padding-right: 40px; }
        .timeline-item.right { left: 50%; padding-left: 40px; }

        /* Timeline Nodes */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            right: -8px;
            background-color: var(--bg-dark);
            border: 4px solid var(--retro-orange);
            top: 35px;
            border-radius: 50%;
            z-index: 2;
        }
        .timeline-item.right::after { left: -8px; border-color: var(--jazz-teal); }

        .content-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid transparent;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        /* Color Coding Profiles */
        .content-card.music-card { border-left: 5px solid var(--retro-orange); }
        .content-card.industrial-card { border-left: 5px solid var(--jazz-teal); }
        .content-card.popculture-card { border-left: 5px solid var(--jazz-purple); }
        .content-card.travel-card { border-left: 5px solid #FFCC00; }

        .content-card:hover {
            transform: translateY(-2px);
            background: #1A1A22;
        }

        .year-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-badge {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text-light);
        }

        .tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .tag.music { background-color: var(--retro-orange); color: #000; }
        .tag.industrial { background-color: var(--jazz-teal); color: #000; }
        .tag.popculture { background-color: var(--jazz-purple); color: #fff; }
        .tag.travel { background-color: #FFCC00; color: #000; }

        .content-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.6rem;
            line-height: 1.3;
        }

        .content-card p {
            color: var(--text-muted);
            line-height: 1.5;
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        .wiki-link {
            display: inline-flex;
            align-items: center;
            color: var(--jazz-teal);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .content-card.music-card .wiki-link { color: var(--retro-orange); }
        .content-card.popculture-card .wiki-link { color: var(--jazz-purple); }
        .content-card.travel-card .wiki-link { color: #FFCC00; }

        .wiki-link:hover {
            border-bottom-color: currentColor;
        }

        @media screen and (max-width: 768px) {
            .timeline-container::after { left: 20px; }
            .timeline-item { width: 100%; padding-left: 45px; padding-right: 0; }
            .timeline-item.right { left: 0; }
            .timeline-item::after { left: 12px !important; right: auto !important; }
        }
    </style>
</head>
<body>

        <input type="text" id="search" class="search-bar" placeholder="Search milestones...">
        <button class="filter-btn active" onclick="filterTimeline('all')">All Highlights</button>

        <button class="filter-btn" onclick="filterTimeline('industrial')">Industrial/Nuclear</button>
        <button class="filter-btn" onclick="filterTimeline('popculture')">Pop Culture</button>

    <main class="timeline-container" id="timeline">

                wikiText: 'Wikipedia: Southern United States',

                desc: 'Marveling at the monumental arches, deep canyons, and brilliant red rock landscapes of Utah.',
                wikiText: 'Wikipedia: Nomad (ancient)',
                url: 'https://en.wikipedia.org/wiki/Utah'
            },
            {
                year: 'Oct 2025',
                type: 'travel',
                title: 'Maine (10th Anniversary) Trip',
                desc: 'A decade of shared horizons celebrated right back where so many memories were forged along the coast of Maine.',
                wikiText: 'Wikipedia: New England',
                url: 'https://en.wikipedia.org/wiki/New_England'
            },
            {
                year: '2026',
                type: 'popculture',
                title: 'The Big 40th Birthday Celebration!',
                desc: 'An extraordinary milestone mapping 40 years of phenomenal cultural eras, industrial history, and an epic travel log.',
                wikiText: 'Wikipedia: Milestone',
                url: 'https://en.wikipedia.org/wiki/Milestone'
            }
        ];

        const timelineContainer = document.getElementById('timeline');

        function renderTimeline(data) {
            timelineContainer.innerHTML = '';
            data.forEach((item, index) => {
                const side = index % 2 === 0 ? 'left' : 'right';
                const itemEl = document.createElement('article');
                itemEl.className = `timeline-item ${side}`;
                
                itemEl.innerHTML = `
                    <div class="content-card ${item.type}-card">
                        <div class="year-header">
                            <span class="year-badge">${item.year}</span>
                            <span class="tag ${item.type}">${item.type}</span>
                        </div>
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="wiki-link">
                            Explore ${item.wikiText} &rarr;
                        </a>
                    </div>
                `;
                timelineContainer.appendChild(itemEl);
            });

            setTimeout(() => {
                const items = document.querySelectorAll('.timeline-item');
                items.forEach(item => item.classList.add('visible'));
            }, 50);
        }

        // Live text filter match
        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = timelineData.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.year.toLowerCase().includes(query) || 
                item.desc.toLowerCase().includes(query)
            );
            renderTimeline(filtered);
        });

        // Category filter layout toggler
        function filterTimeline(type) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Safe fallback finding target element
            if(window.event) {
                window.event.target.classList.add('active');
            }

            if (type === 'all') {
                renderTimeline(timelineData);
            } else {
                const filtered = timelineData.filter(item => item.type === type);
                renderTimeline(filtered);
            }
        }

        // Initialize Timeline Core
        renderTimeline(timelineData);
    </script>

</html>
